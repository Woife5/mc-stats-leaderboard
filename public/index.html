<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minecraft Stats Leaderboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Self-hosted Minecraft stats</p>
        <h1>Leaderboard</h1>
        <p class="muted">Browse player stats, leaderboards, and per-player details.</p>
      </div>
      <div class="stat-card"><span>Players</span><strong id="playerCount">—</strong></div>
    </header>
    <section class="grid cards" id="featured"></section>
    <section class="panel controls">
      <label>Category<select id="categorySelect"></select></label>
      <label>Stat<select id="statSelect"></select></label>
      <button id="loadLeaderboard">Load leaderboard</button>
    </section>
    <section class="layout">
      <article class="panel"><h2>Leaderboard</h2><div id="leaderboard"></div></article>
      <aside class="panel"><h2>Players</h2><input id="search" placeholder="Search players…" /><div id="players"></div></aside>
    </section>
    <section class="panel" id="detail"><h2>Player details</h2><div class="muted">Select a player to inspect stats.</div></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
